machine = "neogeo"
# The system ROM set (neogeo.zip) goes in machines/snk/roms/ and the game sets in machines/snk/software/sets/ (none of them committed;
# RomM has both: firmware 259 and the Neo Geo AES games). The goldens are FinalBurn Neo's pictures (scenarios/capture_neogeo_goldens.py
# prints their hashes), never committed.

[reference]
emulator = "finalburn-neo"
version = "v1.0.0.03 GIT2b0c1c0 (libretro core)"
command = "machines/snk/scenarios/capture_neogeo_goldens.py (libretro_run.py with fbneo_libretro and neogeo.zip in the system folder)"

# The reference draws 304 of our 320 columns (8 cut at each side); the crop is the part both show.
# S1: the BIOS's NEO-GEO logo and then Cyber-Lip's title screen at frame 1000.
[[scenario]]
id = "S1-cyberlip-1000"
kind = "screen"
frames = 1000
files = { rom = "snk/software/sets/cyberlip.zip", rom-bios = "snk/roms/neogeo.zip#*" }
golden = "neogeo/S1-cyberlip-1000.png"
golden_sha256 = "373b6969fb48d63b2321a15ba36b75a4d0e594a0ae29ec45815750945546a437"
compare = { mode = "similarity", max_mad = 6.0, crop = [0.025, 0.0, 0.975, 1.0], golden_crop = [0.0, 0.0, 1.0, 1.0], reason = "another emulator's frame timing and the colour levels: the animated title (the reflections, the stars) is a few frames apart; the pictures agree otherwise" }

# S3: two more cartridge sets reach their own screens. FinalBurn Neo draws these two at the full 320 columns (it cuts 8 at each side
# only for Cyber-Lip, whose set it marks as a 304-pixel game), so no crop.
[[scenario]]
id = "S3-fatfury-1200"
kind = "screen"
frames = 1200
files = { rom = "snk/software/sets/fatfury1.zip", rom-bios = "snk/roms/neogeo.zip#*" }
golden = "neogeo/S3-fatfury-1200.png"
golden_sha256 = "ffd90568a58642ae4fd9d59d0046ecd95030305f63d4969bf9600b55f56d244e"
compare = { mode = "similarity", max_mad = 3.0, reason = "another emulator's frame timing: the title is animated; the pictures agree to a mean of about 1 level in the regions that do not move" }

[[scenario]]
id = "S3-aerofighters2-1200"
kind = "screen"
frames = 1200
files = { rom = "snk/software/sets/sonicwi2.zip", rom-bios = "snk/roms/neogeo.zip#*" }
golden = "neogeo/S3-aerofighters2-1200.png"
golden_sha256 = "5243ae0cd19bcb5597fdd4c818702c95cba323788a51a00799a9fe1287e50fd4"
compare = { mode = "similarity", max_mad = 1.5, crop = [0.0, 0.65, 1.0, 1.0], reason = "the crop is the staff roll and the credit line, which hold still; the plane and the ground above scroll with the game's own clock and are a few frames (about 4 pixels) apart from the reference, as the pictures were compared region by region" }

# S4: the BIOS is silent while the logo comes up (the first 2.5 s here and in FinalBurn Neo, whose level there is 0.0), then plays its
# jingle: that level was compared with the reference by hand (RMS 546 here, 528 there, 3 to 8 s), see docs/neogeo-gaps.md. Music is not a
# tone, so only the silence is a scenario.
[[scenario]]
id = "S4"
kind = "audio"
frames = 200
files = { rom = "snk/software/sets/cyberlip.zip", rom-bios = "snk/roms/neogeo.zip#*" }
audio = { from_s = 0.5, to_s = 2.5, silent_below_rms = 0.001 }

# S6: the NTSC frame is 264 lines of 1536 master clocks.
[[scenario]]
id = "S6"
kind = "timing"
frames = 100
files = { rom = "snk/software/sets/cyberlip.zip", rom-bios = "snk/roms/neogeo.zip#*" }
cycles_per_frame = 405504
cycles_tolerance = 400
